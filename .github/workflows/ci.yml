name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    # Testes que não dependem do ReCap: DeCap é simulado por tests/fake_decap.py.
    # Os testes de integração (tests/integration) são pulados sem RECAP_MCP_INTEGRATION=1.
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependências (uv.lock)
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint
        run: uv run --python ${{ matrix.python }} ruff check src tests
      - name: Testes (sem ReCap)
        run: uv run --python ${{ matrix.python }} pytest -m "not integration" -q
